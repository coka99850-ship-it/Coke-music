<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coka Music</title><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#fff;font-family:system-ui,Arial}header{padding:18px 5%;display:flex;justify-content:space-between;align-items:center;background:#101119;position:sticky;top:0;z-index:5}.logo{font-size:24px;font-weight:900}.logo span{color:#ff3d71}main{width:min(1050px,92%);margin:25px auto;padding-bottom:120px}.hero{padding:32px;border-radius:24px;background:linear-gradient(120deg,#29102d,#141827)}h1{font-size:clamp(36px,8vw,65px);margin:0 0 8px}.muted{color:#aeb3c2}.section{margin-top:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-top:18px}.card{background:#14161e;border:1px solid #252834;padding:15px;border-radius:17px}.cover{height:145px;border-radius:13px;background:linear-gradient(135deg,#ff3d71,#7c3aed);display:grid;place-items:center;font-size:50px}.card h3{margin:10px 0 4px;font-size:16px}.row{display:flex;align-items:center;gap:8px;margin-top:12px}.play{border:0;border-radius:25px;padding:10px 16px;background:#ff3d71;color:#fff;font-weight:800}.player{position:fixed;bottom:0;left:0;right:0;padding:12px 5%;background:#11131bf5;border-top:1px solid #292c36;display:flex;align-items:center;gap:12px;z-index:10}.controls button{border:0;background:none;color:#fff;font-size:21px}.main{background:#fff!important;color:#111!important;border-radius:50%;width:40px;height:40px}.bar{flex:1}input[type=range]{width:100%;accent-color:#ff3d71}@media(max-width:600px){.player{flex-wrap:wrap}.bar{order:3;flex-basis:100%}}</style></head><body><header><div class="logo">Coka<span>Music</span> 🎧</div><div>Hindi • Haryanvi • Punjabi</div></header><main><section class="hero"><h1>Feel the Desi Beat.</h1><p class="muted">Tumhare uploaded songs ab Coka Music player mein 🎵</p></section><section class="section"><h2>🎵 My Uploaded Songs</h2><div class="grid" id="songs"></div></section></main><div class="player"><div><b id="title">Select a song</b><div class="muted" id="artist">Coka Music</div></div><div class="controls"><button onclick="prev()">⏮</button><button class="main" id="toggle" onclick="toggle()">▶</button><button onclick="next()">⏭</button></div><div class="bar"><input id="progress" type="range" min="0" max="100" value="0"></div></div><script>const songs=[['Bawlya More','Hindi / Uploaded','music/Bawlya%20More.mp3'],['Phool Maangu Na Bahaar Maangu - Raja','Hindi / Uploaded','music/Phool%20Maangu%20Na%20Bahaar%20Maangu%20-%20Raja%20%28128%20kbps%29%20%28mp3cut.net%29.mp3'],['Tum Bin Kaise - Tum Mile Toh - Treblo','Hindi / Uploaded','music/Tum%20Bin%20Kaise%20-%20Tum%20Mile%20Toh%20-%20Treblo.mp3']];let cur=-1,a=new Audio(),playing=false;const grid=document.getElementById('songs');grid.innerHTML=songs.map((s,i)=>`<article class="card"><div class="cover">♪</div><h3>${s[0]}</h3><p class="muted">${s[1]}</p><div class="row"><button class="play" onclick="play(${i})">▶ Play</button></div></article>`).join('');function play(i){cur=i;a.src=songs[i][2];a.play().then(()=>{playing=true;document.getElementById('title').textContent=songs[i][0];document.getElementById('artist').textContent=songs[i][1];document.getElementById('toggle').textContent='Ⅱ'}).catch(e=>alert('Song file load nahi hua. GitHub par music folder aur filename check karo.'))}function toggle(){if(cur<0)return play(0);if(a.paused){a.play();playing=true;toggle.textContent='Ⅱ'}else{a.pause();playing=false;toggle.textContent='▶'}}function next(){play((cur+1)%songs.length)}function prev(){play((cur-1+songs.length)%songs.length)}a.ontimeupdate=()=>{if(a.duration)progress.value=a.currentTime/a.duration*100};a.onended=next;const progress=document.getElementById('progress');progress.oninput=()=>{if(a.duration)a.currentTime=progress.value/100*a.duration};</script></body></html>
