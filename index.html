<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coka Music</title><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#fff;font-family:system-ui,Arial}header{padding:22px 6%;display:flex;justify-content:space-between;align-items:center;background:#101119;position:sticky;top:0}.logo{font-size:25px;font-weight:900}.logo span{color:#ff3d71}main{width:min(1000px,92%);margin:30px auto}.hero{padding:35px;border-radius:25px;background:linear-gradient(120deg,#29102d,#141827)}h1{font-size:clamp(38px,7vw,68px);margin:0 0 10px}.muted{color:#aeb3c2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:22px}.card{background:#14161e;border:1px solid #252834;padding:18px;border-radius:18px}.cover{height:160px;border-radius:14px;background:linear-gradient(135deg,#ff3d71,#7c3aed);display:grid;place-items:center;font-size:55px}.row{display:flex;align-items:center;gap:10px;margin-top:15px}.play{margin-left:auto;border:0;border-radius:50%;width:45px;height:45px;background:#fff;color:#111;font-weight:900}.btn{border:0;border-radius:25px;padding:12px 20px;background:#ff3d71;color:#fff;font-weight:800}.player{position:fixed;bottom:0;left:0;right:0;padding:14px 6%;background:#11131bf2;border-top:1px solid #292c36;display:flex;align-items:center;gap:14px}.controls button{border:0;background:none;color:#fff;font-size:22px}.main{background:#fff;color:#111;border-radius:50%;width:42px;height:42px}.bar{flex:1}input[type=range]{width:100%;accent-color:#ff3d71}@media(max-width:600px){.player{flex-wrap:wrap}.bar{order:3;flex-basis:100%}}</style></head><body><header><div class="logo">Coka<span>Music</span> 🎧</div><div>Desi Beats</div></header><main><section class="hero"><h1>Feel the Desi Beat.</h1><p class="muted">Haryanvi • Hindi • Punjabi • Romantic</p><button class="btn" onclick="play(0)">▶ Play Demo</button></section><h2>Trending Now</h2><div class="grid" id="grid"></div></main><div class="player"><div><b id="title">Select a song</b><div class="muted" id="artist">Coka Music</div></div><div class="controls"><button onclick="prev()">⏮</button><button class="main" id="toggle" onclick="toggle()">▶</button><button onclick="next()">⏭</button></div><div class="bar"><input id="progress" type="range" min="0" max="100" value="0"></div></div><script>const songs=[['Desi Beat Demo','Haryanvi Vibes',220],['Coka Love Demo','Coka Music',196],['Punjabi Vibe Demo','Punjabi Vibes',247],['Night Romance Demo','Romantic Hits',174],['Desi Groove Demo','Desi Beats',262]];let cur=-1,playing=false,timer=null,elapsed=0,duration=30,ctx;const grid=document.getElementById('grid');grid.innerHTML=songs.map((s,i)=>`<article class="card"><div class="cover">♪</div><h3>${s[0]}</h3><p class="muted">${s[1]}</p><div class="row"><span>Demo instrumental</span><button class="play" onclick="play(${i})">▶</button></div></article>`).join('');function ac(){return ctx||(ctx=new(window.AudioContext||window.webkitAudioContext)())}function tone(t,f,d,v=.08){const c=ac(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(v,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+d);o.connect(g).connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+d+.02)}function play(i){cur=i;elapsed=0;playing=true;document.getElementById('title').textContent=songs[i][0];document.getElementById('artist').textContent=songs[i][1];ac().resume();clearInterval(timer);timer=setInterval(()=>{if(!playing)return;elapsed+=.25;document.getElementById('progress').value=elapsed/duration*100;if(elapsed>=duration)next()},250);sequence();document.getElementById('toggle').textContent='Ⅱ'}function sequence(){if(!playing)return;const base=songs[cur][2];for(let i=0;i<12;i++){const f=base*Math.pow(2,([0,2,4,7,5,4,2,0][i%8])/12);tone(i*.45,f,.35,.07)}setTimeout(sequence,5400)}function toggle(){if(cur<0)return play(0);playing=!playing;document.getElementById('toggle').textContent=playing?'Ⅱ':'▶';if(playing)sequence()}function next(){play((cur+1)%songs.length)}function prev(){play((cur-1+songs.length)%songs.length)}document.getElementById('progress').oninput=e=>{elapsed=Number(e.target.value)/100*duration};</script></body></html>
